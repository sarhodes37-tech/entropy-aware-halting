name: EpistemicOS CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  test-core-isolation:
    name: Core Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          pip install --require-hashes -r requirements-test-lock.txt
          pip install --no-build-isolation --no-deps -e .
          
      - name: Run Core Tests
        run: pytest tests/unit/

  test-ui-browser:
    name: UI Browser Accessibility & Visual Tests
    needs: test-core-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Core Test Dependencies
        run: |
          pip install --require-hashes -r requirements-test-lock.txt
          pip install --no-build-isolation --no-deps -e .

      - name: Install Playwright & Chromium
        run: |
          pip install playwright>=1.40.0
          playwright install --with-deps chromium

      - name: Run Playwright Browser Accessibility Tests
        run: |
          pytest -v tests/ui/test_workbench_visual_a11y.py tests/ui/test_workbench_accessibility.py

  test-full-execution:
    name: Full Execution Suite
    needs: test-core-isolation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Full Dependencies
        run: |
          pip install --require-hashes -r requirements-full-lock.txt
          pip install --no-build-isolation --no-deps -e .

      - name: Prepare Telemetry Artifact Directory
        run: mkdir -p results

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=epistemicos --cov-report=xml --cov-report=term-missing

      - name: Direct Workflow SHA Verification
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          TARGET_SHA="${{ github.sha }}"
          echo "Checked out HEAD: $HEAD_SHA"
          echo "Workflow SHA:     $TARGET_SHA"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Error: Checked out HEAD ($HEAD_SHA) does not match workflow SHA ($TARGET_SHA)!"
            exit 1
          fi

      - name: Execute Consolidated Four-Layer Evidence Pipeline (Commit-Pinned)
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.generate_evidence_report --commit ${{ github.sha }} --require-clean

      - name: CI Enforcement - Validate Security Evidence Invariants (Standard CI)
        if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'"
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json --manifest-file results/evidence_manifest.json --expected-commit ${{ github.sha }} --require-clean-tree

      - name: CI Enforcement - Validate Security Evidence Invariants (Release CI - Strict Full Pass)
        if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'"
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json --manifest-file results/evidence_manifest.json --expected-commit ${{ github.sha }} --require-clean-tree --require-full-pass

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telemetry-results-${{ matrix.python-version }}
          path: results/
