name: EpistemicOS CI/CD Pipeline

on:
  push:
    # Captures all branches to prevent the silent pipeline skip on feature branches
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-core-isolation:
    name: Core Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          
      - name: Run Core Tests
        run: pytest tests/unit/

  test-full-execution:
    name: Full Execution Suite
    needs: test-core-isolation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          # Leverage the pyproject.toml compartments directly
          pip install -e .[ml,test]

      - name: Prepare Telemetry Artifact Directory
        # This prevents the [Errno 2] crash during the ablation matrix teardown
        run: mkdir -p results

      - name: Run Pytest with Coverage
        # Sweeps both the standard tests and the rigorous benchmark matrix
        run: |
          pytest tests/ benchmarks/ --cov=epistemicos --cov-report=xml --cov-report=term-missing

      - name: Parse Telemetry
        run: |
          python -c "
          import json, sys

          artifact_path = 'results/ablation_telemetry.json'
          try:
              with open(artifact_path, 'r') as f:
                  data = json.load(f)
              
              c4 = data.get('C4_Full_EpistemicOS', {})
              precision = float(c4.get('computed_precision', '0').strip('%'))
              recall = float(c4.get('computed_recall', '0').strip('%'))
              
              print(f'Pipeline Evaluation -> Precision: {precision}%, Recall: {recall}%')
              
              if precision < 100.0 or recall < 100.0:
                  print(f'\n[FATAL ERROR] Security Regression Detected!')
                  print(f'EpistemicOS must maintain absolute determinism (100%).')
                  sys.exit(1)
              
              print('\n[SUCCESS] Zero regressions. C4 Full Stack maintained 100% boundary integrity.')
          except Exception as e:
              print(f'\n[FATAL ERROR] Failed to parse telemetry artifact: {e}')
              sys.exit(1)
          "
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Appending the matrix version prevents artifacts from overwriting each other
          name: telemetry-results-${{ matrix.python-version }}
          path: results/
