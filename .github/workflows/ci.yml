name: EpistemicOS CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-core-isolation:
    name: Core Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          
      - name: Run Core Tests
        run: pytest tests/unit/

  test-full-execution:
    name: Full Execution Suite
    needs: test-core-isolation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-cov
          pip install -e .[ml,test]

      - name: Prepare Telemetry Artifact Directory
        run: mkdir -p results

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=epistemicos --cov-report=xml --cov-report=term-missing

      - name: Execute Measured Benchmark Suite
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.run_full_benchmark

      - name: Parse Measured Telemetry Results
        run: |
          python -c "
          import json, sys, os

          artifact_path = 'results/ablation_table.json'
          if not os.path.exists(artifact_path):
              print(f'[FATAL ERROR] Measured benchmark results not found at {artifact_path}')
              sys.exit(1)

          try:
              with open(artifact_path, 'r') as f:
                  data = json.load(f)
              
              baselines = data.get('baselines', {})
              combined = baselines.get('Combined Gating', {})
              sample_count = combined.get('sample_count', 0)
              accuracy = combined.get('accuracy_pct', 0.0)
              
              print(f'Measured Benchmark Combined Gating Accuracy: {accuracy}% across {sample_count} samples.')
              
              if sample_count == 0:
                  print('[FATAL ERROR] Zero benchmark samples evaluated!')
                  sys.exit(1)
              
              print('\n[SUCCESS] Measured benchmark execution verified.')
          except Exception as e:
              print(f'\n[FATAL ERROR] Failed to parse benchmark results: {e}')
              sys.exit(1)
          "
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-results-${{ matrix.python-version }}
          path: results/
