name: EpistemicOS CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-core-isolation:
    name: Core Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          
      - name: Run Core Tests
        run: pytest tests/unit/

  test-full-execution:
    name: Full Execution Suite
    needs: test-core-isolation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-cov
          pip install -e .[ml,test]

      - name: Prepare Telemetry Artifact Directory
        run: mkdir -p results

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=epistemicos --cov-report=xml --cov-report=term-missing

      - name: Execute Consolidated Four-Layer Evidence Pipeline
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.generate_evidence_report

      - name: CI Enforcement - Validate Security Evidence Invariants (PR CI)
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json

      - name: CI Enforcement - Validate Security Evidence Invariants (Release CI - Strict Full Pass)
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json --require-full-pass

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-results-${{ matrix.python-version }}
          path: results/
