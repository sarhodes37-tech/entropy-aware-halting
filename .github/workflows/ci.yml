name: EpistemicOS CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-core-isolation:
    name: Core Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          
      - name: Run Core Tests
        run: pytest tests/unit/

  test-full-execution:
    name: Full Execution Suite
    needs: test-core-isolation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-cov
          pip install -e .[ml,test]

      - name: Prepare Telemetry Artifact Directory
        run: mkdir -p results

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=epistemicos --cov-report=xml --cov-report=term-missing

      - name: Execute Consolidated Four-Layer Evidence Pipeline
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.generate_evidence_report

      - name: CI Enforcement - Verify Four-Layer Security Evidence Invariants
        run: |
          python -c "
          import json, sys, os

          artifact_path = 'results/four_layer_evidence.json'
          if not os.path.exists(artifact_path):
              print(f'[FATAL ERROR] Four-layer evidence artifact not found at {artifact_path}')
              sys.exit(1)

          try:
              with open(artifact_path, 'r') as f:
                  data = json.load(f)
              
              meta = data.get('reproducibility_metadata', {})
              layers = data.get('layers', {})

              # 1. Dataset Integrity Enforcement
              if not meta.get('dataset_digest_verified'):
                  print('[FATAL ERROR] Dataset SHA-256 digest verification failed!')
                  sys.exit(1)

              # 2. Overall Status & Layer Status Enforcement
              overall = data.get('overall_evaluation_status')
              if overall != 'PASS':
                  print(f'[FATAL ERROR] Overall evaluation status is {overall}, expected PASS!')
                  sys.exit(1)

              # 3. Layer A Enforcement
              layer_a = layers.get('layer_a_deterministic', {})
              if layer_a.get('status') != 'PASS':
                  print(f'[FATAL ERROR] Layer A Deterministic Regression status is {layer_a.get(\"status\")}')
                  sys.exit(1)

              # 4. Layer B Enforcement (Execution Boundary & Breaches)
              layer_b = layers.get('layer_b_execution_boundary', {})
              if layer_b.get('status') != 'PASS' or layer_b.get('breaches_observed', 0) > 0:
                  print(f'[FATAL ERROR] Layer B Execution Boundary observed security breaches: {layer_b.get(\"breaches_observed\")}')
                  sys.exit(1)

              # 5. Layer C Enforcement (Live-Agent Red-Team)
              layer_c = layers.get('layer_c_live_agent_redteam', {})
              if layer_c.get('overall_status') != 'PASS':
                  print(f'[FATAL ERROR] Layer C Live-Agent Red-Team status is {layer_c.get(\"overall_status\")}')
                  sys.exit(1)

              # 6. Layer D Enforcement (Documented Metric Regressions)
              layer_d = layers.get('layer_d_performance_cost', {})
              recall = layer_d.get('combined_gating_recall_pct', 0.0)
              fpr = layer_d.get('combined_gating_fpr_pct', 100.0)

              if recall < 100.0:
                  print(f'[FATAL ERROR] Metric Regression: Combined Gating security recall dropped to {recall}% (Baseline: 100.0%)')
                  sys.exit(1)

              if fpr > 0.0:
                  print(f'[FATAL ERROR] Metric Regression: Benign False Positive Rate increased to {fpr}% (Baseline: 0.0%)')
                  sys.exit(1)

              print('\n[SUCCESS] CI Enforcement passed: All four evidence layers verified with zero security breaches or regressions.')
          except Exception as e:
              print(f'\n[FATAL ERROR] Failed to parse evidence report: {e}')
              sys.exit(1)
          "
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-results-${{ matrix.python-version }}
          path: results/
