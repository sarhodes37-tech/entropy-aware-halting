name: EpistemicOS Security Benchmark

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev" ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  epistemic-validation:
    name: Epistemic Core Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Core Package & Test Harness Dependencies
      run: |
        pip install --require-hashes -r requirements-full-lock.txt
        pip install --no-build-isolation --no-deps -e .

    - name: Run Flake8 (Syntax & Style)
      run: |
        flake8 . --exit-zero 

    - name: Prepare Telemetry Artifact Directory
      run: mkdir -p results

    - name: Execute Consolidated Four-Layer Evidence Pipeline (Commit-Pinned)
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.generate_evidence_report --commit ${{ github.sha }} --require-clean

    - name: Validate Four-Layer Security Evidence Invariants (Standard CI)
      if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'"
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json --manifest-file results/evidence_manifest.json --expected-commit ${{ github.sha }} --require-clean-tree

    - name: Validate Four-Layer Security Evidence Invariants (Release CI - Strict Full Pass)
      if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'"
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json --manifest-file results/evidence_manifest.json --expected-commit ${{ github.sha }} --require-clean-tree --require-full-pass

    - name: Archive Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: epistemic-telemetry-py${{ matrix.python-version }}
        path: results/
        retention-days: 14
