name: EpistemicOS Security Benchmark

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  epistemic-validation:
    name: Epistemic Core Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Core Package & Test Harness Dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Install the actual package to verify build configuration
        pip install -e .
        
        # Install strictly quarantined external simulation tools
        pip install numpy pandas scipy requests openai anthropic pytest flake8

    - name: Run Flake8 (Syntax & Style)
      run: |
        # --exit-zero ensures syntax warnings are logged but don't instantly kill the pipeline
        flake8 . --exit-zero 

    - name: Execute Epistemic Layer Benchmarks
      env:
        PYTHONPATH: .
      run: |
        echo "Executing layered boundary tests and ablation matrix..."
        # This will automatically find and run every test_*.py file in your benchmarks directory
        pytest benchmarks/ -v

    - name: Enforce Zero-Regression Security Policy
      run: |
        python -c "
        import json, sys
        
        artifact_path = 'results/ablation_telemetry.json'
        try:
            with open(artifact_path, 'r') as f:
                data = json.load(f)
            
            c4 = data.get('C4_Full_EpistemicOS', {})
            precision = float(c4.get('computed_precision', '0').strip('%'))
            recall = float(c4.get('computed_recall', '0').strip('%'))
            
            print(f'Pipeline Evaluation -> Precision: {precision}%, Recall: {recall}%')
            
            if precision < 100.0 or recall < 100.0:
                print(f'\n[FATAL ERROR] Security Regression Detected!')
                print(f'EpistemicOS must maintain absolute determinism (100%).')
                sys.exit(1)
            
            print('\n[SUCCESS] Zero regressions. C4 Full Stack maintained 100% boundary integrity.')
        except Exception as e:
            print(f'\n[FATAL ERROR] Failed to parse telemetry artifact: {e}')
            sys.exit(1)
        "

    - name: Archive Telemetry Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: epistemic-telemetry-py${{ matrix.python-version }}
        path: results/ablation_telemetry.json
        retention-days: 14
