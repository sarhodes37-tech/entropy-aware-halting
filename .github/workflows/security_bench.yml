name: EpistemicOS Security Benchmark

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  epistemic-validation:
    name: Epistemic Core Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Core Package & Test Harness Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[ml,test]
        pip install flake8

    - name: Run Flake8 (Syntax & Style)
      run: |
        flake8 . --exit-zero 

    - name: Prepare Telemetry Artifact Directory
      run: mkdir -p results

    - name: Execute Consolidated Four-Layer Evidence Pipeline
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.generate_evidence_report

    - name: Verify Four-Layer Security Evidence Invariants
      run: |
        python -c "
        import json, sys, os
        
        artifact_path = 'results/four_layer_evidence.json'
        
        if not os.path.exists(artifact_path):
            print(f'\n[FATAL ERROR] Four-layer evidence output not found at {artifact_path}.')
            sys.exit(1)
            
        try:
            with open(artifact_path, 'r') as f:
                data = json.load(f)
            
            meta = data.get('reproducibility_metadata', {})
            layers = data.get('layers', {})

            if not meta.get('dataset_digest_verified'):
                print('\n[FATAL ERROR] Dataset SHA-256 digest verification failed!')
                sys.exit(1)

            if data.get('overall_evaluation_status') != 'PASS':
                print(f'\n[FATAL ERROR] Overall evaluation status is {data.get(\"overall_evaluation_status\")}, expected PASS!')
                sys.exit(1)

            layer_d = layers.get('layer_d_performance_cost', {})
            recall = layer_d.get('combined_gating_recall_pct', 0.0)
            if recall < 100.0:
                print(f'\n[FATAL ERROR] Security recall regression: {recall}% < 100.0%')
                sys.exit(1)

            print(f'\n[SUCCESS] Verified four-layer evidence artifact: Overall Status = {data.get(\"overall_evaluation_status\")}, Dataset SHA-256 Verified.')
        except Exception as e:
            print(f'\n[FATAL ERROR] Failed to parse evidence artifact: {e}')
            sys.exit(1)
        "

    - name: Archive Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: epistemic-telemetry-py${{ matrix.python-version }}
        path: results/
        retention-days: 14
