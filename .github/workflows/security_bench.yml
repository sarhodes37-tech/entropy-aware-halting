name: EpistemicOS Security Benchmark

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  epistemic-validation:
    name: Epistemic Core Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Core Package & Test Harness Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[ml,test]
        pip install flake8

    - name: Run Flake8 (Syntax & Style)
      run: |
        flake8 . --exit-zero 

    - name: Prepare Telemetry Artifact Directory
      run: mkdir -p results

    - name: Execute Measured Benchmark Suite
      env:
        PYTHONPATH: .
      run: |
        echo "Executing unit tests..."
        pytest tests/ -v
        echo "Executing measured benchmark suite..."
        python -m benchmarks.run_full_benchmark

    - name: Verify Measured Benchmark Artifacts
      run: |
        python -c "
        import json, sys, os
        
        artifact_path = 'results/ablation_table.json'
        
        if not os.path.exists(artifact_path):
            print(f'\n[FATAL ERROR] Measured benchmark output not found at {artifact_path}.')
            sys.exit(1)
            
        try:
            with open(artifact_path, 'r') as f:
                data = json.load(f)
            
            baselines = data.get('baselines', {})
            if not baselines:
                print('\n[FATAL ERROR] Baseline evaluation records missing.')
                sys.exit(1)

            print('\n[SUCCESS] Verified measured benchmark results:')
            for name, bdata in baselines.items():
                print(f'  - {name}: {bdata.get(\"accuracy_pct\")}% accuracy (N={bdata.get(\"sample_count\")})')
        except Exception as e:
            print(f'\n[FATAL ERROR] Failed to parse benchmark results: {e}')
            sys.exit(1)
        "

    - name: Archive Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: epistemic-telemetry-py${{ matrix.python-version }}
        path: results/
        retention-days: 14
