name: EpistemicOS Security Benchmark

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev" ]
  release:
    types: [ published ]

jobs:
  epistemic-validation:
    name: Epistemic Core Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Core Package & Test Harness Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[ml,test]
        pip install flake8

    - name: Run Flake8 (Syntax & Style)
      run: |
        flake8 . --exit-zero 

    - name: Prepare Telemetry Artifact Directory
      run: mkdir -p results

    - name: Execute Consolidated Four-Layer Evidence Pipeline
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.generate_evidence_report

    - name: Validate Four-Layer Security Evidence Invariants (Standard CI)
      if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'"
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json

    - name: Validate Four-Layer Security Evidence Invariants (Release CI - Strict Full Pass)
      if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'"
      env:
        PYTHONPATH: .
      run: |
        python -m benchmarks.validate_evidence --artifact results/four_layer_evidence.json --require-full-pass

    - name: Archive Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: epistemic-telemetry-py${{ matrix.python-version }}
        path: results/
        retention-days: 14
