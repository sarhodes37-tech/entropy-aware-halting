name: EpistemicOS Security Benchmark

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  epistemic-validation:
    name: Epistemic Core Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install local package and dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
        pip install numpy

    - name: Run RhodesBench (Hard Gate Interception)
      env:
        PYTHONPATH: .
      run: |
        echo "Listing all files in the root directory for debugging:"
        ls -la
        echo "Executing baseline epistemic boundary tests..."
        python test_rhodes_bench.py --target-model ci-pipeline-test

    - name: Execute Formal Ablation Matrix
      env:
        PYTHONPATH: .
      run: |
        echo "Running full combinatorial ablation harness..."
        python epistemicos/ablation_runner.py

    - name: Enforce Zero-Regression Security Policy
      run: |
        python -c "
        import json, sys
        
        artifact_path = 'results/ablation_telemetry.json'
        try:
            with open(artifact_path, 'r') as f:
                data = json.load(f)
            
            c4 = data.get('C4_Full_EpistemicOS', {})
            precision = float(c4.get('computed_precision', '0').strip('%'))
            recall = float(c4.get('computed_recall', '0').strip('%'))
            
            print(f'Pipeline Evaluation -> Precision: {precision}%, Recall: {recall}%')
            
            if precision < 100.0 or recall < 100.0:
                print(f'\n[FATAL ERROR] Security Regression Detected!')
                print(f'EpistemicOS must maintain absolute determinism (100%).')
                sys.exit(1)
            
            print('\n[SUCCESS] Zero regressions. C4 Full Stack maintained 100% boundary integrity.')
        except Exception as e:
            print(f'\n[FATAL ERROR] Failed to parse telemetry artifact: {e}')
            sys.exit(1)
        "

    - name: Archive Telemetry Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: epistemic-telemetry-py${{ matrix.python-version }}
        path: results/ablation_telemetry.json
        retention-days: 14
