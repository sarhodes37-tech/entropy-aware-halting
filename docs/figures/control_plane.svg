<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%" style="background-color: #120F24; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16122C" />
      <stop offset="100%" stop-color="#100D20" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64DED9" />
    </marker>
    <marker id="arrow-lavender" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B69AFF" />
    </marker>
    <marker id="arrow-allow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34D399" />
    </marker>
    <marker id="arrow-halt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF83B8" />
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9889B8" />
    </marker>
  </defs>

  <style>
    .title { font-size: 18px; font-weight: 700; fill: #F1EDFA; letter-spacing: 0.3px; }
    .subtitle { font-size: 12px; fill: #9889B8; }
    .badge { font-size: 10px; font-weight: 700; fill: #64DED9; letter-spacing: 0.8px; }

    /* Containers */
    .container { fill: #1D1833; stroke: #44365F; stroke-width: 1.5; rx: 8px; }
    .container-header { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; }
    .header-ingress { fill: #64DED9; }
    .header-gov { fill: #B69AFF; }
    .header-exec { fill: #38BDF8; }
    .header-decision { fill: #F1EDFA; }
    .header-audit { fill: #A78BFA; }

    /* Inner boxes */
    .box-step { fill: #282044; stroke: #524373; stroke-width: 1.2; rx: 6px; }
    .box-gate { fill: #231D3D; stroke: #6B5596; stroke-width: 1.2; rx: 6px; }
    .box-exec { fill: #1F2747; stroke: #38BDF8; stroke-width: 1.2; rx: 6px; }

    .box-allow { fill: #064E3B; stroke: #34D399; stroke-width: 1.5; rx: 6px; fill-opacity: 0.45; }
    .box-halt { fill: #881337; stroke: #FF83B8; stroke-width: 1.5; rx: 6px; fill-opacity: 0.45; }

    /* Typography inside boxes */
    .text-main { font-size: 11.5px; font-weight: 600; fill: #F1EDFA; }
    .text-sub { font-size: 10px; fill: #9889B8; }
    .text-tag { font-size: 9.5px; font-weight: 600; fill: #64DED9; }

    .text-allow-title { font-size: 12px; font-weight: 700; fill: #34D399; letter-spacing: 0.5px; }
    .text-halt-title { font-size: 12px; font-weight: 700; fill: #FF83B8; letter-spacing: 0.5px; }
    .text-outcome-sub { font-size: 10px; fill: #DDD6FE; }

    /* Connection paths */
    .arrow-cyan { stroke: #64DED9; stroke-width: 1.5; fill: none; marker-end: url(#arrow-cyan); }
    .arrow-gov { stroke: #B69AFF; stroke-width: 1.5; fill: none; marker-end: url(#arrow-lavender); }
    .arrow-allow-path { stroke: #34D399; stroke-width: 1.7; fill: none; marker-end: url(#arrow-allow); }
    .arrow-halt-path { stroke: #FF83B8; stroke-width: 1.7; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-halt); }
    .arrow-audit-path { stroke: #9889B8; stroke-width: 1.2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-muted); }
  </style>

  <!-- Background base -->
  <rect width="1000" height="540" fill="url(#bg-grad)" />

  <!-- Header / Title Section -->
  <g transform="translate(30, 24)">
    <text x="0" y="16" class="title">Figure 1 — EpistemicOS Control Plane Architecture</text>
    <text x="0" y="34" class="subtitle">Deterministic Halting, Ordered Fail-Closed Governance Gates, Execution Boundary &amp; Cryptographic Provenance</text>
  </g>

  <!-- ==================== STAGE 1: INGRESS & NORMALIZATION ==================== -->
  <rect x="25" y="75" width="165" height="305" class="container" />
  <text x="37" y="98" class="container-header header-ingress">1. Ingress Normalization</text>

  <rect x="37" y="115" width="141" height="60" class="box-step" />
  <text x="107" y="138" class="text-main" text-anchor="middle">Task Payload</text>
  <text x="107" y="154" class="text-sub" text-anchor="middle">Raw Unsanitized Input</text>

  <path d="M 107 175 L 107 205" class="arrow-cyan" />

  <rect x="37" y="205" width="141" height="60" class="box-step" />
  <text x="107" y="228" class="text-main" text-anchor="middle">CPR Normalization</text>
  <text x="107" y="244" class="text-sub" text-anchor="middle">Canonical Problem Repr.</text>

  <path d="M 107 265 L 107 295" class="arrow-cyan" />

  <rect x="37" y="295" width="141" height="65" class="box-step" />
  <text x="107" y="318" class="text-main" text-anchor="middle">Pre-Execution Store</text>
  <text x="107" y="334" class="text-sub" text-anchor="middle">Action Proposed Event</text>
  <text x="107" y="348" class="text-tag" text-anchor="middle">ACTION_PROPOSED</text>

  <!-- Flow to Stage 2 -->
  <path d="M 190 235 L 215 235" class="arrow-cyan" />

  <!-- ==================== STAGE 2: ORDERED GOVERNANCE GATES ==================== -->
  <rect x="215" y="75" width="335" height="305" class="container" />
  <text x="227" y="98" class="container-header header-gov">2. Ordered Governance Gates (Fail-Closed)</text>

  <!-- Gate 1: ShowerCurtain -->
  <rect x="227" y="112" width="311" height="52" class="box-gate" />
  <text x="382" y="132" class="text-main" text-anchor="middle">Stage A–E: ShowerCurtain Privacy Gate</text>
  <text x="382" y="148" class="text-sub" text-anchor="middle">PII Detection, Pseudonym Mapping &amp; Egress Policy</text>

  <!-- Gate 2: Entropy Gate -->
  <rect x="227" y="176" width="311" height="52" class="box-gate" />
  <text x="382" y="196" class="text-main" text-anchor="middle">Entropy-Aware Halting Gate</text>
  <text x="382" y="212" class="text-sub" text-anchor="middle">Token Surprisal (h = -log p) &amp; Z-Score Halting Threshold</text>

  <!-- Gate 3: Permission Gate -->
  <rect x="227" y="240" width="311" height="52" class="box-gate" />
  <text x="382" y="260" class="text-main" text-anchor="middle">Permission &amp; Scope Gate</text>
  <text x="382" y="276" class="text-sub" text-anchor="middle">Action-Resource Scope Binding &amp; Executable Validation</text>

  <!-- Gate 4: Triangulation Gate -->
  <rect x="227" y="304" width="311" height="52" class="box-gate" />
  <text x="382" y="324" class="text-main" text-anchor="middle">Triangulation &amp; Consistency Gate</text>
  <text x="382" y="340" class="text-sub" text-anchor="middle">Cross-Stream Telemetry &amp; Hardware Consistency</text>

  <!-- Inter-gate connectors -->
  <path d="M 382 164 L 382 176" class="arrow-gov" />
  <path d="M 382 228 L 382 240" class="arrow-gov" />
  <path d="M 382 292 L 382 304" class="arrow-gov" />

  <!-- ==================== STAGE 3: EXECUTION BOUNDARY ==================== -->
  <rect x="570" y="75" width="200" height="305" class="container" />
  <text x="582" y="98" class="container-header header-exec">3. Execution Boundary</text>

  <rect x="582" y="115" width="176" height="60" class="box-exec" />
  <text x="670" y="137" class="text-main" text-anchor="middle">Trusted Boundary</text>
  <text x="670" y="153" class="text-sub" text-anchor="middle">Single-Use Capability Token</text>
  <text x="670" y="167" class="text-tag" text-anchor="middle">Option A Object Identity</text>

  <path d="M 670 175 L 670 205" class="arrow-cyan" />

  <rect x="582" y="205" width="176" height="60" class="box-exec" />
  <text x="670" y="227" class="text-main" text-anchor="middle">Containment Guard</text>
  <text x="670" y="243" class="text-sub" text-anchor="middle">Socket &amp; URI Sandboxing</text>
  <text x="670" y="257" class="text-tag" text-anchor="middle">Default-Deny Egress</text>

  <path d="M 670 265 L 670 295" class="arrow-cyan" />

  <rect x="582" y="295" width="176" height="65" class="box-exec" />
  <text x="670" y="318" class="text-main" text-anchor="middle">Protected Execution</text>
  <text x="670" y="334" class="text-sub" text-anchor="middle">Registered Tool Invocation</text>
  <text x="670" y="348" class="text-tag" text-anchor="middle">Zero-Arg Closure Dispatch</text>

  <!-- ==================== STAGE 4: DECISION OUTCOMES ==================== -->
  <rect x="790" y="75" width="185" height="305" class="container" />
  <text x="802" y="98" class="container-header header-decision">4. Decision Outcomes</text>

  <!-- ALLOW / COMMIT -->
  <rect x="802" y="115" width="161" height="95" class="box-allow" />
  <text x="882" y="145" class="text-allow-title" text-anchor="middle">&#x2713; ALLOW / COMMIT</text>
  <text x="882" y="165" class="text-outcome-sub" text-anchor="middle">Approved Action Invocation</text>
  <text x="882" y="181" class="text-sub" text-anchor="middle">Trajectories Committed</text>
  <text x="882" y="197" class="text-tag" text-anchor="middle">EXECUTION_SUCCEEDED</text>

  <!-- HALT / ROLLBACK -->
  <rect x="802" y="235" width="161" height="125" class="box-halt" />
  <text x="882" y="265" class="text-halt-title" text-anchor="middle">&#x2717; HALT / ROLLBACK</text>
  <text x="882" y="285" class="text-outcome-sub" text-anchor="middle">Fail-Closed Block</text>
  <text x="882" y="301" class="text-sub" text-anchor="middle">0 Side Effects on Sandbox</text>
  <text x="882" y="317" class="text-sub" text-anchor="middle">Vector Cache Revocation</text>
  <text x="882" y="337" class="text-tag" text-anchor="middle" fill="#FF83B8">AUTHORIZATION_DENIED</text>

  <!-- ==================== FLOW CONNECTIONS ==================== -->
  <!-- Governance All Passed -> Execution Boundary -->
  <path d="M 538 330 L 554 330 L 554 145 L 570 145" class="arrow-allow-path" />

  <!-- Execution Boundary Passed -> ALLOW -->
  <path d="M 758 327 L 775 327 L 775 162 L 802 162" class="arrow-allow-path" />

  <!-- Governance Violation Fail-Closed -> HALT -->
  <path d="M 538 138 L 558 138 L 558 297 L 802 297" class="arrow-halt-path" />

  <!-- ==================== STAGE 5: AUDIT TRAIL & PROVENANCE ==================== -->
  <rect x="25" y="400" width="950" height="115" class="container" />
  <text x="37" y="423" class="container-header header-audit">5. Cryptographic Audit Trail &amp; Local Provenance Store (Tamper-Evident SHA-256 Chain)</text>

  <rect x="37" y="435" width="926" height="65" class="box-step" />
  <text x="500" y="460" class="text-main" text-anchor="middle">Tamper-Evident SHA-256 Entry Hash Chain &amp; Signed Capability Receipts</text>
  <text x="500" y="478" class="text-sub" text-anchor="middle">Cryptographically binds Ingress Payload Digests, Gate Decisions, Execution Boundary Verification, Outcomes, &amp; Provenance Events</text>
  <text x="500" y="492" class="text-tag" text-anchor="middle">prev_hash &#x2192; entry_hash &#x2022; LocalProvenanceStore durably fsynced &#x2022; Replay-Resistant Single-Use Tokens</text>

  <!-- Connect outcomes down to Audit Trail -->
  <path d="M 882 210 L 882 225 L 780 225 L 780 435" class="arrow-audit-path" />
  <path d="M 882 360 L 882 435" class="arrow-audit-path" />

</svg>