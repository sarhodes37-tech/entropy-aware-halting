<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #58a6ff; }
    .subtitle { font-size: 12px; fill: #8b949e; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
    .box-highlight { fill: #1c2128; stroke: #58a6ff; stroke-width: 2; rx: 6px; }
    .box-gate { fill: #1f242e; stroke: #d29922; stroke-width: 1.5; rx: 6px; }
    .box-halt { fill: #271010; stroke: #f85149; stroke-width: 1.5; rx: 6px; }
    .box-allow { fill: #0d2818; stroke: #3fb950; stroke-width: 1.5; rx: 6px; }
    .text-main { font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .text-sub { font-size: 11px; fill: #8b949e; }
    .text-gate { font-size: 13px; font-weight: 600; fill: #e3b341; }
    .text-halt { font-size: 12px; font-weight: bold; fill: #f85149; }
    .text-allow { font-size: 12px; font-weight: bold; fill: #3fb950; }
    .arrow { stroke: #58a6ff; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-dashed { stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-gray); }
    .arrow-halt { stroke: #f85149; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-red); }
    .boundary { fill: none; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 6,6; rx: 8px; }
    .boundary-label { font-size: 11px; font-weight: bold; fill: #8b949e; text-anchor: end; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f85149" />
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="35" class="title">Figure 1 — EpistemicOS Control Plane Architecture</text>
  <text x="30" y="55" class="subtitle">Deterministic Halting, Ordered Governance Gates, Vector Revocation, and Audit Trail</text>

  <!-- Main Pipeline Boundary -->
  <rect x="20" y="75" width="860" height="380" class="boundary" />
  <text x="865" y="95" class="boundary-label">EPISTEMICOS CONTROL PLANE BOUNDARY</text>

  <!-- Step 1: Input -->
  <rect x="40" y="130" width="140" height="70" class="box" />
  <text x="110" y="160" class="text-main" text-anchor="middle">Input Task Payload</text>
  <text x="110" y="178" class="text-sub" text-anchor="middle">&amp; Request Context</text>

  <!-- Step 2: Normalization -->
  <rect x="220" y="130" width="150" height="70" class="box" />
  <text x="295" y="155" class="text-main" text-anchor="middle">1. Input Validation</text>
  <text x="295" y="173" class="text-sub" text-anchor="middle">&amp; CPR Normalization</text>

  <!-- Step 3: Governance Gates -->
  <rect x="410" y="110" width="230" height="190" class="box-highlight" />
  <text x="525" y="135" class="text-main" text-anchor="middle">2. Ordered Governance Gates</text>

  <!-- Sub-Gate A: Shower Curtain (Optional/Configured) -->
  <rect x="430" y="150" width="190" height="38" class="box-gate" />
  <text x="525" y="173" class="text-gate" text-anchor="middle">Shower Curtain Privacy Gate</text>

  <!-- Sub-Gate B: Entropy Gate -->
  <rect x="430" y="198" width="190" height="38" class="box-gate" />
  <text x="525" y="221" class="text-gate" text-anchor="middle">Entropy-Aware Halting Gate</text>

  <!-- Sub-Gate C: Permission Gate -->
  <rect x="430" y="246" width="190" height="38" class="box-gate" />
  <text x="525" y="269" class="text-gate" text-anchor="middle">Permission &amp; Command Gate</text>

  <!-- Step 4: Decision Flow -->
  <!-- Allow Outcome -->
  <rect x="680" y="130" width="170" height="55" class="box-allow" />
  <text x="765" y="155" class="text-allow" text-anchor="middle">ALLOW / COMMIT</text>
  <text x="765" y="172" class="text-sub" text-anchor="middle">Execute Payload Action</text>

  <!-- Halt Outcome -->
  <rect x="680" y="225" width="170" height="55" class="box-halt" />
  <text x="765" y="250" class="text-halt" text-anchor="middle">HALT / ROLLBACK</text>
  <text x="765" y="267" class="text-sub" text-anchor="middle">Fail-Closed Defense</text>

  <!-- Step 5: Side Effects -->
  <!-- Vector Revocation -->
  <rect x="680" y="310" width="170" height="45" class="box" />
  <text x="765" y="337" class="text-main" text-anchor="middle">Vector Revocation</text>

  <!-- Telemetry & Audit -->
  <rect x="220" y="370" width="420" height="60" class="box" />
  <text x="430" y="395" class="text-main" text-anchor="middle">3. Telemetry &amp; Cryptographic Audit Trail</text>
  <text x="430" y="413" class="text-sub" text-anchor="middle">Hardware Telemetry, Latency MS, Hash Chain Receipt Minting</text>

  <!-- Entropy Scheduler (Optional / Associated Module) -->
  <rect x="40" y="240" width="140" height="80" class="box" />
  <text x="110" y="268" class="text-main" text-anchor="middle">Entropy Scheduler</text>
  <text x="110" y="286" class="text-sub" text-anchor="middle">(Optional Iterative</text>
  <text x="110" y="300" class="text-sub" text-anchor="middle">Trajectory Search)</text>

  <!-- Arrows -->
  <path d="M 180 165 L 220 165" class="arrow" />
  <path d="M 370 165 L 410 165" class="arrow" />
  <path d="M 640 157 L 680 157" class="arrow" />
  <path d="M 640 252 L 680 252" class="arrow-halt" />
  <path d="M 765 280 L 765 310" class="arrow-halt" />

  <!-- Audit log connectors -->
  <path d="M 525 300 L 525 370" class="arrow-dashed" />
  <path d="M 765 355 L 765 400 L 640 400" class="arrow-dashed" />

  <!-- Scheduler connector -->
  <path d="M 110 200 L 110 240" class="arrow-dashed" />
</svg>
