<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%" style="background-color: #120F24; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad-sc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16122C" />
      <stop offset="100%" stop-color="#100D20" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan-sc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64DED9" />
    </marker>
    <marker id="arrow-lavender-sc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B69AFF" />
    </marker>
    <marker id="arrow-return-sc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34D399" />
    </marker>
    <marker id="arrow-remote-sc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF83B8" />
    </marker>
    <marker id="arrow-amber-sc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FBBF24" />
    </marker>
  </defs>

  <style>
    .title { font-size: 18px; font-weight: 700; fill: #F1EDFA; letter-spacing: 0.3px; }
    .subtitle { font-size: 12px; fill: #9889B8; }

    /* Enclosure Boundaries */
    .boundary-local { fill: #17132B; stroke: #64DED9; stroke-width: 1.5; stroke-dasharray: 6,5; rx: 10px; }
    .boundary-remote { fill: #1D1427; stroke: #FF83B8; stroke-width: 1.5; stroke-dasharray: 6,5; rx: 10px; }
    .boundary-label-local { font-size: 11px; font-weight: 700; fill: #64DED9; letter-spacing: 0.8px; text-transform: uppercase; }
    .boundary-label-remote { font-size: 11px; font-weight: 700; fill: #FF83B8; letter-spacing: 0.8px; text-transform: uppercase; text-anchor: end; }

    /* Module Boxes */
    .box-local { fill: #231D3D; stroke: #44365F; stroke-width: 1.2; rx: 6px; }
    .box-vault { fill: #1D2644; stroke: #38BDF8; stroke-width: 1.2; rx: 6px; }
    .box-egress { fill: #2E1B3A; stroke: #FBBF24; stroke-width: 1.5; rx: 6px; }
    .box-remote { fill: #2B162E; stroke: #FF83B8; stroke-width: 1.2; rx: 6px; }

    /* Typography */
    .text-title-local { font-size: 12px; font-weight: 700; fill: #64DED9; }
    .text-title-vault { font-size: 12px; font-weight: 700; fill: #38BDF8; }
    .text-title-egress { font-size: 12px; font-weight: 700; fill: #FBBF24; }
    .text-title-remote { font-size: 12px; font-weight: 700; fill: #FF83B8; }

    .text-main { font-size: 11.5px; font-weight: 600; fill: #F1EDFA; }
    .text-sub { font-size: 10px; fill: #9889B8; }
    .text-tag { font-size: 9.5px; font-weight: 600; fill: #B69AFF; }
    .text-badge-redact { font-size: 9px; font-weight: 700; fill: #FBBF24; }

    /* Connecting paths */
    .arrow-cyan { stroke: #64DED9; stroke-width: 1.5; fill: none; marker-end: url(#arrow-cyan-sc); }
    .arrow-lavender { stroke: #B69AFF; stroke-width: 1.5; fill: none; marker-end: url(#arrow-lavender-sc); }
    .arrow-amber { stroke: #FBBF24; stroke-width: 1.5; fill: none; marker-end: url(#arrow-amber-sc); }
    .arrow-remote-out { stroke: #FF83B8; stroke-width: 1.6; fill: none; marker-end: url(#arrow-remote-sc); }
    .arrow-return-in { stroke: #34D399; stroke-width: 1.6; fill: none; marker-end: url(#arrow-return-sc); }
  </style>

  <!-- Background base -->
  <rect width="1000" height="540" fill="url(#bg-grad-sc)" />

  <!-- Header / Title Section -->
  <g transform="translate(30, 24)">
    <text x="0" y="16" class="title">Figure 2 — Shower Curtain Privacy Boundary</text>
    <text x="0" y="34" class="subtitle">Local Data Sanitization, Cryptographic Pseudonym Mapping, Egress Gate &amp; Authorized Rehydration</text>
  </g>

  <!-- ==================== LOCAL TRUSTED PRIVACY BOUNDARY ==================== -->
  <rect x="25" y="75" width="675" height="435" class="boundary-local" />
  <text x="42" y="100" class="boundary-label-local">&#x1F6E1; LOCAL TRUSTED PRIVACY BOUNDARY (NEVER DISCLOSED TO NETWORK)</text>

  <!-- ==================== UNTRUSTED REMOTE PROVIDER BOUNDARY ==================== -->
  <rect x="725" y="75" width="250" height="435" class="boundary-remote" />
  <text x="958" y="100" class="boundary-label-remote">&#x26A0; UNTRUSTED REMOTE PROVIDER</text>

  <!-- Step 1: Raw Input -->
  <rect x="45" y="125" width="160" height="70" class="box-local" />
  <text x="125" y="148" class="text-title-local" text-anchor="middle">1. Raw User Request</text>
  <text x="125" y="167" class="text-sub" text-anchor="middle">Client Prompt &amp; Context</text>
  <text x="125" y="183" class="text-tag" text-anchor="middle">Contains PII / Secrets / Keys</text>

  <path d="M 205 160 L 245 160" class="arrow-cyan" />

  <!-- Step 2: Detection & Minimization -->
  <rect x="245" y="125" width="195" height="70" class="box-local" />
  <text x="342" y="148" class="text-main" text-anchor="middle">Stage A &amp; D: Detector</text>
  <text x="342" y="167" class="text-sub" text-anchor="middle">PII, Regex &amp; Secrets Extraction</text>
  <text x="342" y="183" class="text-tag" text-anchor="middle">O(log N) Disjoint Interval Merging</text>

  <path d="M 342 195 L 342 235" class="arrow-lavender" />

  <!-- Step 3: Policy Evaluation -->
  <rect x="45" y="235" width="160" height="75" class="box-local" />
  <text x="125" y="258" class="text-main" text-anchor="middle">Stage B: Privacy Policy</text>
  <text x="125" y="277" class="text-sub" text-anchor="middle">Enforces Rule Matrix</text>
  <text x="125" y="295" class="text-badge-redact" text-anchor="middle">&#x2022; PASS  &#x2022; REDACT  &#x2022; BLOCK</text>

  <!-- Step 4: Local Vault -->
  <rect x="245" y="235" width="195" height="75" class="box-vault" />
  <text x="342" y="258" class="text-title-vault" text-anchor="middle">Stage C: Local Mapping Vault</text>
  <text x="342" y="277" class="text-sub" text-anchor="middle">HMAC Keyed Session Isolation</text>
  <text x="342" y="295" class="text-tag" text-anchor="middle">Deterministic &lt;PSEUDONYM_ID&gt;</text>

  <path d="M 205 272 L 245 272" class="arrow-lavender" />
  <path d="M 440 272 L 480 272" class="arrow-amber" />

  <!-- Stage E: Egress Gate -->
  <rect x="480" y="125" width="195" height="185" class="box-egress" />
  <text x="577" y="155" class="text-title-egress" text-anchor="middle">Stage E: Egress Gate</text>
  <text x="577" y="182" class="text-main" text-anchor="middle">Pre-Flight Wire Inspection</text>
  <text x="577" y="202" class="text-sub" text-anchor="middle">Deep JSON &amp; Param Scanning</text>
  <text x="577" y="222" class="text-sub" text-anchor="middle">Default-Deny External Network</text>
  <text x="577" y="247" class="text-title-egress" text-anchor="middle" font-size="10.5px">&#x26A0; Halts if Unsanitized Leak</text>
  <text x="577" y="267" class="text-tag" text-anchor="middle">Socket Boundary Enforcement</text>

  <!-- Remote Provider -->
  <rect x="745" y="185" width="210" height="180" class="box-remote" />
  <text x="850" y="220" class="text-title-remote" text-anchor="middle">External LLM Provider</text>
  <text x="850" y="242" class="text-sub" text-anchor="middle">(e.g., Anthropic / OpenAI API)</text>
  <text x="850" y="275" class="text-main" text-anchor="middle">Receives ONLY Pseudonyms</text>
  <text x="850" y="295" class="text-sub" text-anchor="middle">Real names, emails, keys</text>
  <text x="850" y="312" class="text-sub" text-anchor="middle">never leave host memory</text>
  <text x="850" y="335" class="text-tag" text-anchor="middle">Zero Residual Storage Risk</text>

  <!-- Inbound Response Inspection & Rehydration -->
  <rect x="245" y="360" width="430" height="85" class="box-local" />
  <text x="460" y="388" class="text-title-local" text-anchor="middle">Stage F: Inbound Response Inspection &amp; Authorized Rehydration</text>
  <text x="460" y="408" class="text-sub" text-anchor="middle">Validates Response Integrity &#x2022; Prevents Hallucinated Token Injection</text>
  <text x="460" y="426" class="text-tag" text-anchor="middle">Strict Substitution: Exact Matching Vault Inversion Only</text>

  <path d="M 342 310 L 342 360" class="arrow-lavender" />

  <!-- Rehydrated Output -->
  <rect x="45" y="360" width="160" height="85" class="box-local" />
  <text x="125" y="392" class="text-title-local" text-anchor="middle">Rehydrated Response</text>
  <text x="125" y="414" class="text-sub" text-anchor="middle">Safe Client Terminal</text>
  <text x="125" y="432" class="text-tag" text-anchor="middle">&#x2713; Authentic Context Restored</text>

  <!-- Flow Arrows connecting boundaries -->
  <!-- Egress -> Remote -->
  <path d="M 675 220 L 745 220" class="arrow-remote-out" />

  <!-- Remote -> Response Inspection -->
  <path d="M 745 340 L 710 340 L 710 405 L 675 405" class="arrow-return-in" />

  <!-- Response Inspection -> Client Output -->
  <path d="M 245 402 L 205 402" class="arrow-return-in" />

</svg>