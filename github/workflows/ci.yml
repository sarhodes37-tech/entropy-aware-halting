name: EpistemicOS CI Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Testing across all supported versions to ensure strict standard library compatibility
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs requirements if the file exists; ensures pytest is available for the integration suite
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Run RhodesBench Adversarial Vector
      run: |
        python test_rhodes_bench.py

    - name: Execute Gamma Integration Suite
      run: |
        pytest tests/integration/test_pipeline_gamma.py -v
