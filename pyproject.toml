[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemicos"
version = "0.1.0"
description = "Production-grade AI governance, risk management, and deterministic execution engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EpistemicOS Engineering", email = "admin@epistemicos.org"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# THE ZERO-DEPENDENCY CORE
# Pydantic is the only mandatory dependency for the baseline data models.
dependencies = [
    "pydantic>=2.0.0",
]

# THE HIDDEN COMPARTMENTS
# Users must explicitly request these via `pip install epistemicos[ml]` or `[test]`
[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
all = ["ml", "test"]

[tool.setuptools.packages.find]
include = ["epistemicos", "epistemicos.*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
